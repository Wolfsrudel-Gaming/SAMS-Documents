memory_limit = 256M
; upload_max_filesize unterhalb von post_max_size halten (Logo-Upload max. 600 KB)
upload_max_filesize = 2M
post_max_size = 8M
expose_php = Off
date.timezone = Europe/Berlin
; Härtung gegen CVE-2026-109619 (PHP2Shell) – Upload-Fortschritt wird nicht genutzt
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; Geänderte Dateien nach einem Auto-Update sofort erkennen
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
