# HTTPS-Erkennung hinter dem Reverse-Proxy des Hosts
map $http_x_forwarded_proto $fwd_https {
    https   on;
    default off;
}

server {
    listen 80;
    server_name _;
    root /var/www/sams/public;
    index index.php;
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fwd_https;
    }

    location ~* \.(css|js|svg|woff2|png|jpg)$ {
        expires 7d;
        access_log off;
    }

    location ~ /\. { deny all; }
}
