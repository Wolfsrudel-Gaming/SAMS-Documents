# nginx ohne Docker – Webroot ist NUR der Ordner public/
server {
    listen 80;
    server_name sams.example.com;
    root /var/www/sams/public;
    index index.php;
    client_max_body_size 18m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(css|js|svg|woff2|png|jpg)$ {
        expires 7d;
        access_log off;
    }

    location ~ /\. { deny all; }
}
# HTTPS: sudo certbot --nginx -d sams.example.com
