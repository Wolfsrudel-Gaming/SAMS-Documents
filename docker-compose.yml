# SAMS mit Docker: docker compose up -d
# Konfiguration kommt aus der Datei .env (Vorlage: .env.example)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./:/var/www/sams
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Öffentlich über einen Reverse-Proxy mit HTTPS (z. B. nginx/Caddy auf dem Host) bereitstellen
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/sams:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-sams}
      MARIADB_USER: ${DB_USERNAME:-sams}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
